# Sobe a API e o dashboard.
#
#     docker compose up --build
#
# API:       http://localhost:8000/docs
# Dashboard: http://localhost:8501
#
# Os volumes são essenciais: sem eles, o modelo atualizado por `/update`
# e o histórico de predições desapareceriam a cada reinicialização.
#
# Eles também conectam os dois serviços: o dashboard lê o mesmo arquivo
# SQLite que a API grava, sem acoplamento entre os processos.
#
# Os health checks são definidos nas imagens, por meio da instrução
# `HEALTHCHECK` nos Dockerfiles. Por isso, `docker compose up --wait`
# aguarda efetivamente até que os dois serviços estejam saudáveis.

services:
  api:
    build: .
    container_name: rain-api
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models    # modelo atualizado + registro de versões
      - ./data:/app/data        # SQLite de monitoramento
    environment:
      MODEL_PATH: /app/models/model.pt
      DB_PATH: /app/data/monitoring.db
      REGISTRY_PATH: /app/models/registry.json
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    container_name: rain-dashboard
    ports:
      - "8501:8501"
    volumes:
      # Somente leitura: o dashboard nunca escreve no banco.
      - ./data:/app/data:ro
      - ./models:/app/models:ro
    environment:
      DB_PATH: /app/data/monitoring.db
      REGISTRY_PATH: /app/models/registry.json
    # Define apenas a ordem de inicialização. O dashboard não chama a API:
    # ele lê o SQLite diretamente e, portanto, não depende dela para funcionar.
    # `condition: service_healthy` não é usado de propósito, pois introduziria
    # uma espera sem necessidade.
    depends_on:
      - api
    restart: unless-stopped
