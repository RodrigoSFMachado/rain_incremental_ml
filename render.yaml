# Deploy da API no Render (free tier).
#
# STATUS: deploy público validado para inferência. O serviço está acessível
# pela URL documentada no README, com health check, Swagger e `POST /predict`
# validados. O serviço atualmente exibido no painel foi criado manualmente;
# por isso, a região efetiva do serviço pode ser diferente da região declarada
# abaixo no Blueprint.
#
# Este arquivo descreve uma forma reproduzível de criar a API pelo fluxo
# "New > Blueprint" do Render. Ele cobre somente a API; o dashboard não é
# publicado por este blueprint.
#
# Limitações relevantes do plano gratuito:
#
# 1. O serviço pode hibernar após um período sem tráfego. A primeira
#    requisição depois disso pode levar mais tempo para responder.
#
# 2. O filesystem é efêmero. O modelo atualizado por `/update`, o
#    `registry.json` e o `monitoring.db` retornam ao estado da imagem após
#    reinício ou novo deploy. Na nuvem, `/update` demonstra o ciclo, mas não
#    oferece persistência durável do aprendizado.
#
#    Para persistência real, seria necessário um volume persistente ou
#    armazenamento externo, como object storage. Isso permanece fora do
#    escopo deste projeto e está documentado no README.
#
# 3. O plano gratuito oferece recursos limitados. A imagem usa PyTorch
#    CPU-only, conforme configurado no Dockerfile, para evitar o tamanho das
#    bibliotecas CUDA distribuídas pela versão padrão do PyPI.
#
# A plataforma injeta a porta pela variável `PORT`. O CMD do Dockerfile usa
# essa variável e mantém 8000 como fallback para o ambiente local.

services:
  - type: web
    name: rain-prediction-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: MODEL_PATH
        value: /app/models/model.pt
      - key: DB_PATH
        value: /app/data/monitoring.db
      - key: REGISTRY_PATH
        value: /app/models/registry.json
