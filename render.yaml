# Deploy no Render (free tier).
#
# STATUS: configuração preparada, mas AINDA NÃO validada por um deploy
# real na nuvem. Até aqui, o que foi validado é a execução local via
# Docker Compose. Trate este arquivo como próximo passo, não como um
# ambiente em funcionamento.
#
# Uso: no painel do Render, selecione "New > Blueprint" e aponte para o
# repositório.
#
# Escopo: apenas a API. O dashboard não é publicado por este blueprint.
#
# Limitações relevantes do plano gratuito:
#
# 1. O serviço hiberna após 15 minutos sem tráfego. A primeira requisição
#    depois disso pode levar até um minuto para responder.
#
# 2. O disco é efêmero. O modelo atualizado por `/update`, o `registry.json`
#    e o `monitoring.db` retornam ao estado da imagem após cada reinício ou
#    deploy. Na nuvem, `/update` demonstra o ciclo, mas não oferece
#    persistência durável do aprendizado.
#
#    Para persistência real, seria necessário um volume pago ou
#    armazenamento externo — fora do escopo deste projeto e documentado
#    no README.
#
# 3. O plano gratuito oferece 512 MB de RAM. Como a importação do PyTorch
#    consome cerca de 250 MB, a imagem precisa usar o torch CPU-only,
#    conforme configurado no Dockerfile. A versão do PyPI, com bibliotecas
#    CUDA, não cabe nesse limite.
#
# A plataforma injeta a porta pela variável `PORT`. O CMD do Dockerfile
# utiliza essa variável e mantém 8000 como fallback no ambiente local.

services:
  - type: web
    name: rain-prediction-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: MODEL_PATH
        value: /app/models/model.pt
      - key: DB_PATH
        value: /app/data/monitoring.db
      - key: REGISTRY_PATH
        value: /app/models/registry.json
